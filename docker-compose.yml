services:
  db:
    image: postgres:16-alpine
    container_name: dictadle-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-dictadle_db}
    ports:
      - "${DB_EXTERNAL_PORT:-5433}:5432"
    volumes:
      - dictadle_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-dictadle_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - dictadle-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dictadle-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_APP: wsgi.py
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-dictadle_docker_production_secret_key}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-dictadle_db}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      DEPLOYMENT_SLOT: ${DEPLOYMENT_SLOT:-blue}
      APP_VERSION: ${APP_VERSION:-2.0.0}
      INSTANCE_READY: ${INSTANCE_READY:-true}
      SEED_ADMIN_ON_BOOT: ${SEED_ADMIN_ON_BOOT:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@dictadle.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin12345}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request, sys; resp = urllib.request.urlopen('http://localhost:5000/api/health/ready', timeout=4); sys.exit(0 if resp.status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - dictadle-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: dictadle-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - dictadle-net

volumes:
  dictadle_postgres_data:
    name: dictadle_postgres_data

networks:
  dictadle-net:
    name: dictadle-net
    driver: bridge
