name: Dictadle CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-ci:
    name: Backend CI (PostgreSQL, Migrations & Coverage)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: dictadle_ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Database Migrations on PostgreSQL
        env:
          FLASK_APP: wsgi.py
          FLASK_ENV: development
          DATABASE_URL: postgresql+psycopg2://postgres:postgres_ci_password@localhost:5432/dictadle_ci_db
          SECRET_KEY: ci_secret_key_testing_dictadle
        run: |
          flask db upgrade

      - name: Verify Availability Driver DA-DIS-DEV-002 (Blue/Green Readiness Gate)
        env:
          FLASK_ENV: testing
          TEST_DATABASE_URI: "sqlite:///:memory:"
          SECRET_KEY: ci_secret_key_testing_dictadle
        run: |
          pytest tests/integration/test_availability_driver.py -v

      - name: Run Pytest Suite with Coverage
        env:
          FLASK_ENV: testing
          TEST_DATABASE_URI: "sqlite:///:memory:"
          SECRET_KEY: ci_secret_key_testing_dictadle
        run: |
          python -m coverage run --source=app -m pytest tests -v

      - name: Generate Coverage Report & Quality Gate (Min 80%)
        run: |
          python -m coverage report -m --fail-under=80

  frontend-ci:
    name: Frontend CI (Build & Dependencies)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend Application
        run: npm run build

      - name: Verify Usability Driver DA-USA-I1-003 & Media Playback Tests
        run: npm test
